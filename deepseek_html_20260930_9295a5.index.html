/* AI summary */
function buildSituationSummary(){
  const lines=[];
  if(Date.now()-lastBallisticAlarmAt<5*60*1000){
    const ago=Math.round((Date.now()-lastBallisticAlarmAt)/60000);
    lines.push(`🚨 АКТИВНА ТРИВОГА БАЛІСТИКИ (${ago} хв тому)`);
    lines.push("");
  }
  if(lastAlerts){
    let kyivAlert=false,oblAlert=false;
    for(const list of[lastAlerts.raions,lastAlerts.oblasts]){
      for(const a of (list||[])){
        const s=String(a.key||"")+" "+String(a.name||"");
        if(/київ(?!ськ)|киев(?!ск)/i.test(s)){if(/обл/i.test(s))oblAlert=true;else kyivAlert=true;}
      }
    }
    if(kyivAlert)lines.push("🔴 Київ: ПОВІТРЯНА ТРИВОГА");
    else if(oblAlert)lines.push("🟠 Київська обл.: повітряна тривога");
    else lines.push("🟢 Офіційної тривоги немає");
  }else lines.push("ℹ Немає даних про тривоги");
  const warnArr=[...activeWarnings.values()].filter(w=>!w.dismissed);
  if(warnArr.length){lines.push("");lines.push(`⚠️ Попереджень: ${warnArr.length}`);for(const w of warnArr)lines.push("   • "+w.warning.label);}
  if(impactReports.size){lines.push("");lines.push(`💥 Прильоти: ${impactReports.size}`);for(const r of impactReports.values())lines.push(`   • ${r.report.icon} ${r.name}`);}
  const all=[];
  for(const tr of tracks.values()){
    if(tr.threat.areaOnly||tr.threat.advisory)continue;
    const ll=tr.marker.getLatLng();if(!ll)continue;
    const d=haversineKm(CONFIG.KYIV[0],CONFIG.KYIV[1],ll.lat,ll.lng);
    all.push({src:"api",label:typeLabel(tr.threat),name:tr.threat.locality||tr.threat.region||"—",dist:d,eta:tr.eta,hasPriority:tr._msgChannels?hasPrioritySource(tr._msgChannels):false});
  }
  for(const o of msgMarkers.values()){
    if(!o.marker)continue;
    const ll=o.marker.getLatLng();if(!ll)continue;
    const d=haversineKm(CONFIG.KYIV[0],CONFIG.KYIV[1],ll.lat,ll.lng);
    all.push({src:"msg",label:o.cls?.label||"?",name:o.place?.name||o.targetPlace?.name||"?",dist:d,eta:o.eta,hasPriority:!!o.hasPriority});
  }
  lines.push("");
  if(!all.length)lines.push("✈ Цілей у зоні: немає");
  else{
    lines.push(`🎯 Цілей у зоні: ${all.length}`);
    all.sort((a,b)=>a.dist-b.dist);
    for(const t of all.slice(0,10)){
      const prio=t.hasPriority?"⭐ ":"";
      const src=t.src==="api"?" (API)":"";
      const distStr=t.dist<50?`${t.dist.toFixed(0)} км`:`${Math.round(t.dist)} км`;
      const etaStr=t.eta!=null?` · ⏱ ${formatEta(t.eta)}`:"";
      lines.push(`   • ${prio}${t.label}${src} — ${t.name} · ${distStr}${etaStr}`);
    }
    if(all.length>10)lines.push(`   … та ще ${all.length-10}`);
  }
  lines.push("");
  if(all.length){
    const n=all[0];
    lines.push(`🎯 Найближче: ${n.label} — ${n.name} (${Math.round(n.dist)} км від Києва)`);
  }else lines.push("🎯 У зоні Києва — чисто");
  lines.push("");
  lines.push(`🧩 Ланцюжків: ${trails.size}`);
  lines.push(`💥 Вибухів за 30 хв: ${impactMarkers.size}`);
  return lines.join("\n");
}

/* WS + REST */
let ws=null,wsConnected=false,wsReconnectMs=CONFIG.WS_RECONNECT_MS,wsReconnectTimer=null;
let restFallbackActive=false,pollTimer=null,abortCtrl=null;
const wsState={threats:new Map()};
function wsScheduleReconnect(){
  if(wsReconnectTimer)return;
  wsReconnectTimer=setTimeout(()=>{wsReconnectTimer=null;wsConnect();},wsReconnectMs);
  wsReconnectMs=Math.min(wsReconnectMs*2,CONFIG.WS_RECONNECT_MAX_MS);
}
function wsConnect(){
  try{
    if(ws){try{ws.close();}catch(e){}ws=null;}
    ws=new WebSocket(CONFIG.WS_URL);
    ws.onopen=()=>{wsConnected=true;wsReconnectMs=CONFIG.WS_RECONNECT_MS;restFallbackActive=false;stopRestPolling();updateLiveBadge("ok");};
    ws.onmessage=(e)=>{try{wsHandleFrame(JSON.parse(e.data));}catch(err){}};
    ws.onerror=()=>{};
    ws.onclose=()=>{
      wsConnected=false;ws=null;updateLiveBadge("err");
      if(!restFallbackActive){restFallbackActive=true;startRestPolling();}
      wsScheduleReconnect();
    };
  }catch(e){if(!restFallbackActive){restFallbackActive=true;startRestPolling();}wsScheduleReconnect();}
}
function wsHandleFrame(env){
  if(!env||!env.type)return;
  switch(env.type){
    case "snapshot":{
      const data=env.data||{};
      wsState.threats.clear();
      for(const t of (data.threats||[]))if(t.id)wsState.threats.set(t.id,t);
      if(data.alerts){lastAlerts=data.alerts;try{syncAlertPolygons(data.alerts);}catch(e){}}
      applyThreatsFromWs();break;
    }
    case "upsert":{const t=env.data;if(t&&t.id){wsState.threats.set(t.id,t);applyThreatsFromWs();}break;}
    case "remove":{const data=env.data||{};if(data.id)wsState.threats.delete(data.id);applyThreatsFromWs();break;}
    case "alerts":{const data=env.data||{};lastAlerts=data;try{syncAlertPolygons(data);}catch(e){}break;}
  }
}
function applyThreatsFromWs(){try{syncThreats([...wsState.threats.values()]);}catch(e){}}
async function fetchMessages(){
  try{
    const r=await fetch(CONFIG.API_MESSAGES);
    if(!r.ok)throw 0;
    const d=await r.json();
    try{syncMessageThreats(d.messages||[]);}catch(e){}
  }catch(e){}
}
async function fetchThreatsAndAlerts(){
  try{
    if(abortCtrl)abortCtrl.abort();
    abortCtrl=new AbortController();
    const signal=abortCtrl.signal;
    const[tr,al]=await Promise.all([
      fetch(CONFIG.API_THREATS,{signal}).then(r=>{if(!r.ok)throw new Error("threats "+r.status);return r.json();}),
      fetch(CONFIG.API_ALERTS,{signal}).then(r=>{if(!r.ok)throw new Error("alerts "+r.status);return r.json();})
    ]);
    try{syncThreats(tr.threats||[]);}catch(e){}
    try{syncAlertPolygons(al);}catch(e){}
    updateLiveBadge("ok");
  }catch(e){if(e.name!=="AbortError")updateLiveBadge("err");}
}
async function restPollLoop(){await fetchThreatsAndAlerts();await fetchMessages();pollTimer=setTimeout(restPollLoop,CONFIG.POLL_MS);}
function startRestPolling(){if(pollTimer)clearTimeout(pollTimer);restPollLoop();}
function stopRestPolling(){if(pollTimer){clearTimeout(pollTimer);pollTimer=null;}if(abortCtrl){abortCtrl.abort();abortCtrl=null;}}
function updateLiveBadge(state){
  if(state==="ok")setStatus(wsConnected?"ok":"warn",wsConnected?"ONLINE · WS":"ONLINE");
  else setStatus("err","ОФЛАЙН");
}
let lastAlerts=null;
async function loadAlertGeo(signal){
  try{
    await Promise.all([
      fetch("https://neptun.in.ua/raions.geojson",{signal}).then(x=>x.json()),
      fetch("https://neptun.in.ua/oblasts.geojson",{signal}).then(x=>x.json())
    ]);
    if(lastAlerts)syncAlertPolygons(lastAlerts);
  }catch(e){if(e.name!=="AbortError")console.warn(e);}
}
let alertLayers=[];
function syncAlertPolygons(alerts){
  if(!alerts)return;
  lastAlerts=alerts;
  for(const l of alertLayers){try{alertLayer.removeLayer(l);}catch(e){}}
  alertLayers=[];
  const allLists=[];
  if(alerts.raions)allLists.push(...alerts.raions);
  if(alerts.oblasts)allLists.push(...alerts.oblasts);
  if(alerts.regions)allLists.push(...alerts.regions);
  for(const a of allLists){
    if(!a.geometry&&!a.coords&&!a.polygon)continue;
    let latlngs=null;
    try{
      if(a.geometry&&a.geometry.type==="Polygon")latlngs=a.geometry.coordinates.map(ring=>ring.map(c=>[c[1],c[0]]));
      else if(a.geometry&&a.geometry.type==="MultiPolygon")latlngs=a.geometry.coordinates.map(poly=>poly.map(ring=>ring.map(c=>[c[1],c[0]])));
      else if(a.coords)latlngs=a.coords.map(c=>[c[1],c[0]]);
      else if(a.polygon)latlngs=a.polygon.map(c=>[c[1],c[0]]);
    }catch(e){continue;}
    if(!latlngs)continue;
    const alertName=String(a.name||"")+" "+String(a.key||"");
    const isKyiv=isKyivOrOblast(alertName);
    let color="#dc2626",fillColor="#dc2626";
    if(/обл/i.test(alertName)||/область/.test(alertName)){color="#ea580c";fillColor="#ea580c";}
    if(isKyiv){color="#dc2626";fillColor="#dc2626";}
    try{
      const layer=L.polygon(latlngs,{color,weight:1.5,opacity:.8,fillColor,fillOpacity:.15,interactive:isKyiv,className:"alert-polygon"});
      if(isKyiv){
        layer.bindPopup(`<div class="popup-title" style="color:#f87171">🚨 Повітряна тривога</div>
          <div class="popup-meta"><b>${esc(a.name||a.key||"")}</b><br>Київ / Київська область</div>`,CONFIG.POPUP_OPTS);
      }
      layer.addTo(alertLayer);
      alertLayers.push(layer);
    }catch(e){}
  }
}

$("aiModalCopy").addEventListener("click",async()=>{
  try{await navigator.clipboard.writeText($("aiModalBody").textContent||"");$("aiModalCopy").textContent="✅";setTimeout(()=>{$("aiModalCopy").textContent="📋 Копіювати";},1500);}
  catch(e){$("aiModalCopy").textContent="❌";setTimeout(()=>{$("aiModalCopy").textContent="📋 Копіювати";},1500);}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("aiModalBackdrop").classList.contains("show"))hideAIExplain();});

$("panelHeader").addEventListener("click",()=>{
  const p=$("panel");
  if(p)p.classList.toggle("collapsed");
});

(function(){
  const b=$("soundToggle");if(!b)return;
  function update(){b.textContent=CONFIG.SOUND_ENABLED?"🔔":"🔕";b.className="sound-btn "+(CONFIG.SOUND_ENABLED?"on":"muted");}
  update();
  let last=0;
  b.addEventListener("click",e=>{
    e.preventDefault();e.stopPropagation();
    unlockAudio();
    const n=Date.now();
    playAlertSound(true);
    if(n-last<500){CONFIG.SOUND_ENABLED=!CONFIG.SOUND_ENABLED;update();showToast(CONFIG.SOUND_ENABLED?"🔔 увімк":"🔕 вимк");last=0;}
    else{last=n;showToast("🔔 тест");}
  });
})();
(function(){
  const b=$("sirenBtn");if(!b)return;
  let last=0;
  b.addEventListener("click",e=>{
    e.preventDefault();e.stopPropagation();
    unlockAudio();
    const n=Date.now();
    if(n-last<500){triggerSirenSequence(3000,3);showToast("🚨 3× сирена");last=0;}
    else{playSirenOnce(3000);flashSirenBtn(3000);showToast("🚨 1× (2 тапи = 3×)");last=n;}
  });
})();
(function(){
  const b=$("btnColorToggle");if(!b)return;
  function update(){
    const c=UAV_COLORS[uavColorIdx];
    b.textContent="🎨";
    b.style.background=c.hex;
    b.style.borderColor=(c.id==="white")?"rgba(148,163,184,.5)":"rgba(0,0,0,.35)";
    b.style.color=(c.id==="white"||c.id==="yellow")?"#1e293b":"#fff";
  }
  update();
  b.addEventListener("click",e=>{
    e.preventDefault();e.stopPropagation();
    uavColorIdx=(uavColorIdx+1)%UAV_COLORS.length;
    saveUavColor();update();refreshAllIcons();
    showToast("🎨 БПЛА: "+UAV_COLORS[uavColorIdx].name);
    unlockAudio();
  });
})();
(function(){
  const b=$("btnRingsToggle");if(!b||!map)return;
  try{const v=localStorage.getItem(RINGS_KEY);if(v==="1")ringsVisible=true;}catch(e){}
  function apply(){
    if(ringsVisible){if(!map.hasLayer(ringsLayer))ringsLayer.addTo(map);b.classList.add("on");b.classList.remove("off");}
    else{if(map.hasLayer(ringsLayer))map.removeLayer(ringsLayer);b.classList.add("off");b.classList.remove("on");}
  }
  apply();
  b.addEventListener("click",e=>{
    e.preventDefault();e.stopPropagation();
    ringsVisible=!ringsVisible;
    try{localStorage.setItem(RINGS_KEY,ringsVisible?"1":"0");}catch(e2){}
    apply();showToast(ringsVisible?"🎯 Кільця УВІМК":"🎯 Кільця ВИКЛ");
    unlockAudio();
  });
})();
(function(){
  const b=$("btnMapToggle");if(!b||!map)return;
  b.addEventListener("click",e=>{
    e.preventDefault();e.stopPropagation();
    unlockAudio();
    if(currentBase==="osm"){
      if(osmLayer)map.removeLayer(osmLayer);
      baseSat.addTo(map);
      currentBase="sat";b.classList.add("on");showToast("🛰 Супутник");
    }else{
      map.removeLayer(baseSat);
      osmLayer=L.tileLayer(CONFIG.TILE_URL,{maxZoom:19,attribution:CONFIG.TILE_ATTR});
      osmLayer.addTo(map);
      currentBase="osm";b.classList.remove("on");showToast("🗺 Схема");
    }
  });
})();
(function(){
  const b=$("btnHighPrec");if(!b)return;
  b.addEventListener("click",e=>{
    e.preventDefault();e.stopPropagation();
    highPrecisionOnly=!highPrecisionOnly;
    b.classList.toggle("on",highPrecisionOnly);
    applyHighPrec();
    showToast(highPrecisionOnly?"🎯+ тільки точні":"🎯+ усі");
    unlockAudio();
  });
})();

document.addEventListener("visibilitychange",()=>{
  if(document.hidden){stopRestPolling();stopAnim();}
  else{if(!wsConnected)startRestPolling();startAnim();unlockAudio();}
});

(async function init(){
  try{
    setStatus("warn","ЗАГРУЗКА…");
    const ctrl=new AbortController();
    loadAlertGeo(ctrl.signal);
    wsConnect();
    fetchMessages();
    setInterval(fetchMessages,5000);
    startAnim();
    renderFeed();
    setInterval(renderFeed,8000);
    setTimeout(()=>unlockAudio(),500);
  }catch(e){showErr("init: "+(e&&e.message||e));}
})();
</script>
</body>
</html>
